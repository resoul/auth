# Local development services. Ports are bound to loopback only.
# The credentials below are for this throwaway local database, not for any other environment.
name: airlance-auth

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: airlance_auth
      POSTGRES_PASSWORD: airlance_auth
      POSTGRES_DB: airlance_auth
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airlance_auth -d airlance_auth"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI and API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
