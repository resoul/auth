components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token of an active session.
  responses:
    InvalidRequest:
      description: invalid_request — malformed JSON or a field of the wrong shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: unauthenticated — no valid access token of an active session.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
            enum: [Bearer]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PermissionDenied:
      description: permission_denied — the request came from an origin that is not trusted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: rate_limited.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TemporarilyUnavailable:
      description: temporarily_unavailable — an infrastructure failure, independent of the input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    NativeStartRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254
          example: alice@example.com
        client_binding:
          type: string
          description: The binding secret received from an earlier start; omit it on the first start.
    NativeStartResponse:
      type: object
      required: [flow_id, expires_at, resend_after]
      properties:
        flow_id:
          type: string
        expires_at:
          type: string
          format: date-time
        resend_after:
          type: string
          format: date-time
        client_binding:
          type: string
          description: Present only when this call issued a new binding; store it in secure storage.
    NativeVerifyRequest:
      type: object
      required: [flow_id, code, client_binding]
      properties:
        flow_id:
          type: string
        code:
          type: string
          description: The 8 digits from the email, without spaces.
          example: "30999009"
        client_binding:
          type: string
    NextStepResponse:
      type: object
      required: [next, ticket, expires_at]
      properties:
        next:
          type: string
          enum: [enroll_passkey, second_factor]
          description: |
            `enroll_passkey`: register a passkey with the ticket. `second_factor`: prove a
            passkey with the ticket, or spend a recovery code.
        ticket:
          type: string
          description: A one-time secret for the next step; short-lived and bound to the client binding.
        expires_at:
          type: string
          format: date-time
    CeremonyResponse:
      type: object
      required: [challenge_id, options]
      properties:
        challenge_id:
          type: string
          description: Send it back with the result of the ceremony.
        options:
          type: object
          additionalProperties: true
          description: The WebAuthn options to pass to navigator.credentials.create or .get.
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            name: stdjson
            path: encoding/json
    NativePasskeyOptionsRequest:
      type: object
      required: [ticket, client_binding]
      properties:
        ticket:
          type: string
        client_binding:
          type: string
    BrowserPasskeyOptionsRequest:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string
    NativePasskeyRegisterRequest:
      type: object
      required: [ticket, client_binding, challenge_id, credential]
      properties:
        ticket:
          type: string
        client_binding:
          type: string
        challenge_id:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential from navigator.credentials.create, as JSON.
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            name: stdjson
            path: encoding/json
        name:
          type: string
          maxLength: 64
          description: Optional label of the passkey, such as "Work laptop".
        device_name:
          type: string
          maxLength: 64
          description: Optional label of the new session.
    BrowserPasskeyRegisterRequest:
      type: object
      required: [ticket, challenge_id, credential]
      properties:
        ticket:
          type: string
        challenge_id:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential from navigator.credentials.create, as JSON.
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            name: stdjson
            path: encoding/json
        name:
          type: string
          maxLength: 64
        device_name:
          type: string
          maxLength: 64
    NativePasskeyRegisterResponse:
      type: object
      required: [user, access_token, expires_at, refresh_token, recovery_codes]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
          description: Expiry of access_token.
        refresh_token:
          type: string
        recovery_codes:
          type: array
          items:
            type: string
          description: Shown once. Keep them offline; each works once.
    BrowserPasskeyRegisterResponse:
      type: object
      required: [user, access_token, expires_at, recovery_codes]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
          description: Expiry of access_token.
        recovery_codes:
          type: array
          items:
            type: string
          description: Shown once. Keep them offline; each works once.
    NativePasskeyLoginRequest:
      type: object
      required: [challenge_id, credential]
      properties:
        challenge_id:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential from navigator.credentials.get, as JSON.
          x-go-type: stdjson.RawMessage
