  /v1/native/auth/device/start:
    post:
      tags: [native]
      operationId: nativeStartDeviceSignIn
      summary: Ask for a session on this device, to be approved on another
      description: |
        Called by a device that has no session, for example a browser or a TV. Returns the request identifier a QR code should carry, the
        pairing code the device must show, and the poll secret it keeps: the identifier alone proves nothing, and the QR code never holds the
        secret. A client binding is issued when the request carries none. The request lives five minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeDeviceStartRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeDeviceStartResponse"
        "400":
          description: invalid_proof or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/auth/device/status:
    post:
      tags: [native]
      operationId: nativeDeviceSignInStatus
      summary: Ask how the request stands
      description: |
        Reports pending, approved, denied, redeemed or expired. An unknown request, a wrong secret and a wrong binding are all invalid_proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeDeviceStatusRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatusResponse"
        "400":
          description: invalid_proof or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/auth/device/redeem:
    post:
      tags: [native]
      operationId: nativeRedeemDeviceSignIn
      summary: Take the session of an approved request
      description: |
        Gives the device that made an approved request its own session, once. It needs the poll secret and the binding the request was made with.
        The approving session must still be open and the user not blocked. Every refusal is invalid_proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeDeviceRedeemRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativePasskeyLoginResponse"
        "400":
          description: invalid_proof or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/device/requests/{request_id}:
    get:
      tags: [native]
      operationId: nativeGetDeviceRequest
      summary: See who asks to sign in
      description: |
        Shows a live pending request to a signed-in user: the label the new device gave itself and the times. The pairing code is not shown here; the person reads it on the new device.
      security:
        - bearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRequestView"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: not_found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/device/requests/{request_id}/approve:
    post:
      tags: [native]
      operationId: nativeApproveDeviceRequest
      summary: Let the device sign in as this user
      description: |
        Needs the step-up token for approve_device, which a successful approval uses up, and the pairing code typed from the screen of the new device.
        A wrong code spends one of three attempts of the request and the third kills it; a refusal spends no step-up token.
      security:
        - bearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
        - name: X-Step-Up
          in: header
          required: false
          schema:
            type: string
          description: The step-up token for approve_device; without a valid one the answer is step_up_required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceApproveRequest"
      responses:
        "204":
          description: Done.
        "400":
          description: invalid_proof or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: step_up_required, so run a step-up for approve_device first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: not_found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/device/requests/{request_id}/deny:
    post:
      tags: [native]
      operationId: nativeDenyDeviceRequest
      summary: Refuse the request
      description: |
        Ends a pending request. It needs a session but no step-up: refusing opens nothing.
      security:
        - bearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Done.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: not_found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
