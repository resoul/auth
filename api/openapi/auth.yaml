openapi: 3.0.3
info:
  title: Airlance Auth
  version: 0.1.0
  description: |
    Contract of the routes served by the authentication service.

    Two profiles share the operations. `/v1/native/` is for explicit native clients: the
    refresh token and the client binding travel in JSON and cookies are ignored. `/v1/` is for
    browsers: the refresh token and the client binding live in HttpOnly cookies that JSON
    never carries, state-changing requests pass the cross-origin check, and CORS answers only
    the configured origins. A request that has neither profile's credentials is refused.

    Every error body carries a stable code and the request_id that is also sent in the
    X-Request-Id header. Responses of /v1/ routes carry `Cache-Control: no-store`.
    The server speaks plain HTTP: run it behind a TLS-terminating proxy or ingress.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: browser
    description: Email sign-in and refresh for browsers; secrets live in HttpOnly cookies.
  - name: native
    description: Email sign-in and token refresh for explicit native clients.
  - name: public
    description: Key set and health shared by every profile.
paths:
  /v1/native/auth/email/start:
    post:
      tags: [native]
      operationId: nativeStartEmail
      summary: Start an email sign-in flow and queue the code
      description: |
        The response schema is the same for a new and an existing email. A client that
        has no binding yet omits client_binding and receives one; it then sends it to
        verify and to its next start calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeStartRequest"
      responses:
        "202":
          description: Flow started; the code is on its way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeStartResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/auth/email/verify:
    post:
      tags: [native]
      operationId: nativeVerifyEmail
      summary: Prove the code and receive the ticket for the next step
      description: |
        A wrong, expired or used code, an unknown flow and a wrong binding all give the
        same invalid_code. A successful verify creates the user on first sign-in, but opens
        no session: a session needs a passkey. The
        response says what comes next and carries the ticket for it: `enroll_passkey` for a
        user who has no passkey, `second_factor` for one who has. A flow verifies at most once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeVerifyRequest"
      responses:
        "200":
          description: The email is proven; carry the ticket to the next step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextStepResponse"
        "400":
          description: invalid_code or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/auth/passkey/register/options:
    post:
      tags: [native]
      operationId: nativeBeginPasskeyRegistration
      summary: Start registering a passkey
      description: |
        Needs the ticket of a verify that answered `enroll_passkey` (or of a recovery code). `client_binding` is the binding secret of the email sign-in.
        The ticket is not spent here. The response is the challenge to echo back and the options
        to pass to navigator.credentials.create: a resident key and user verification are required.
        Every refusal is invalid_proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativePasskeyOptionsRequest"
      responses:
        "200":
          description: The ceremony to run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyResponse"
        "400":
          description: invalid_proof or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/auth/passkey/register/verify:
    post:
      tags: [native]
      operationId: nativeFinishPasskeyRegistration
      summary: Finish registering a passkey and sign in
      description: |
        Verifies the attestation, stores the passkey and opens the session the ticket was waiting
        for. The response carries the refresh token and the recovery codes.
        The recovery codes are shown once; an older set stops working. A refused ceremony spends its
        challenge, not the ticket. Every refusal is invalid_proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativePasskeyRegisterRequest"
      responses:
        "200":
          description: Registered and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativePasskeyRegisterResponse"
        "400":
          description: invalid_proof or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/auth/passkey/login/options:
    post:
      tags: [native]
      operationId: nativeBeginPasskeyLogin
      summary: Start a passkey assertion
      description: |
        Names no user: the authenticator offers the passkeys it holds for this service. The same
        ceremony serves a passkey sign-in and the second factor after an email code.
      responses:
        "200":
          description: The ceremony to run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyResponse"
        "400":
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/auth/passkey/login/verify:
    post:
      tags: [native]
      operationId: nativeFinishPasskeyLogin
      summary: Verify the assertion and sign in
      description: |
        Without a ticket the passkey alone signs in. With the ticket of a verify that answered
        `second_factor` it completes that sign-in, and the ticket's binding becomes the session's. The response carries the refresh token, and a client binding when it sent none.
        A counter that did not grow, a key of another user and every other refusal are invalid_proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativePasskeyLoginRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativePasskeyLoginResponse"
        "400":
          description: invalid_proof or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/auth/recovery/verify:
    post:
      tags: [native]
      operationId: nativeRedeemRecoveryCode
      summary: Spend a recovery code in place of a passkey
      description: |
        Needs the `second_factor` ticket of a verify. `client_binding` is the binding secret of the email sign-in. It opens no session: a right code
        returns the ticket to register a new passkey, which is the only way past lost keys. Every attempt that
        reaches the code spends the second-factor ticket, so guessing costs an email proof each time.
        Every refusal is invalid_proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeRecoveryRequest"
      responses:
        "200":
          description: The ticket to register a new passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextStepResponse"
        "400":
          description: invalid_proof or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/auth/passkey/register/options:
    post:
      tags: [browser]
      operationId: browserBeginPasskeyRegistration
      summary: Start registering a passkey
      description: |
        Needs the ticket of a verify that answered `enroll_passkey` (or of a recovery code). The binding cookie of the email sign-in is required.
        The ticket is not spent here. The response is the challenge to echo back and the options
        to pass to navigator.credentials.create: a resident key and user verification are required.
        Every refusal is invalid_proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserPasskeyOptionsRequest"
      responses:
        "200":
          description: The ceremony to run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyResponse"
        "400":
          description: invalid_proof or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/auth/passkey/register/verify:
    post:
      tags: [browser]
      operationId: browserFinishPasskeyRegistration
      summary: Finish registering a passkey and sign in
      description: |
        Verifies the attestation, stores the passkey and opens the session the ticket was waiting
        for. The response sets the refresh cookie and renews the binding cookie; the JSON carries the access token and the recovery codes.
        The recovery codes are shown once; an older set stops working. A refused ceremony spends its
        challenge, not the ticket. Every refusal is invalid_proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserPasskeyRegisterRequest"
      responses:
        "200":
          description: Registered and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserPasskeyRegisterResponse"
        "400":
          description: invalid_proof or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/auth/passkey/login/options:
    post:
      tags: [browser]
      operationId: browserBeginPasskeyLogin
      summary: Start a passkey assertion
      description: |
        Names no user: the authenticator offers the passkeys it holds for this service. The same
        ceremony serves a passkey sign-in and the second factor after an email code.
      responses:
        "200":
          description: The ceremony to run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyResponse"
        "400":
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/auth/passkey/login/verify:
    post:
      tags: [browser]
      operationId: browserFinishPasskeyLogin
      summary: Verify the assertion and sign in
      description: |
        Without a ticket the passkey alone signs in. With the ticket of a verify that answered
        `second_factor` it completes that sign-in, and the ticket's binding becomes the session's. The response sets the refresh cookie and the binding cookie (a new one when the browser had none); the JSON carries the access token.
        A counter that did not grow, a key of another user and every other refusal are invalid_proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserPasskeyLoginRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserPasskeyLoginResponse"
        "400":
          description: invalid_proof or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/auth/recovery/verify:
    post:
      tags: [browser]
      operationId: browserRedeemRecoveryCode
      summary: Spend a recovery code in place of a passkey
      description: |
        Needs the `second_factor` ticket of a verify. The binding cookie of the email sign-in is required. It opens no session: a right code
        returns the ticket to register a new passkey, which is the only way past lost keys. Every attempt that
        reaches the code spends the second-factor ticket, so guessing costs an email proof each time.
        Every refusal is invalid_proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserRecoveryRequest"
      responses:
        "200":
          description: The ticket to register a new passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextStepResponse"
        "400":
          description: invalid_proof or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/token/refresh:
    post:
      tags: [native]
      operationId: nativeRefreshToken
      summary: Exchange a refresh token for new tokens
      description: |
        Strict rotation: the presented token is used up. Presenting a used token again
        revokes the whole session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeRefreshRequest"
      responses:
        "200":
          description: New access and refresh tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeRefreshResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: invalid_refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/auth/email/resend:
    post:
      tags: [native]
      operationId: nativeResendEmail
      summary: Send a new code for the same flow
      description: |
        Invalidates the previous code of the flow; the flow, its expiry and its attempts stay.
        Allowed once per resend pause. A flow that cannot continue, or a wrong binding, gives
        invalid_code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeResendRequest"
      responses:
        "202":
          description: A new code is on its way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendResponse"
        "400":
          description: invalid_code or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/auth/email/start:
    post:
      tags: [browser]
      operationId: browserStartEmail
      summary: Start an email sign-in flow and queue the code
      description: |
        The client binding is the `__Secure-px_binding` cookie (HttpOnly, Secure, Path
        `/v1/auth/email`). A browser without it receives one in this response's Set-Cookie;
        the JSON never carries it. A malformed cookie is replaced like a missing one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserStartRequest"
      responses:
        "202":
          description: Flow started; the code is on its way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/auth/email/verify:
    post:
      tags: [browser]
      operationId: browserVerifyEmail
      summary: Prove the code and receive the ticket for the next step
      description: |
        Needs the binding cookie of the start. The response opens no session: it names the
        next step and carries the ticket for it, which is useless without the same binding
        cookie. Every refusal is invalid_code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserVerifyRequest"
      responses:
        "200":
          description: The email is proven; carry the ticket to the next step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextStepResponse"
        "400":
          description: invalid_code or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/auth/email/resend:
    post:
      tags: [browser]
      operationId: browserResendEmail
      summary: Send a new code for the same flow
      description: Needs the binding cookie of the start; see the native operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserResendRequest"
      responses:
        "202":
          description: A new code is on its way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendResponse"
        "400":
          description: invalid_code or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/token/refresh:
    post:
      tags: [browser]
      operationId: browserRefreshToken
      summary: Exchange the refresh cookie for a new access token
      description: |
        Reads only the `__Secure-px_refresh` cookie; a refresh token in the body is not
        accepted. Strict rotation sets a new cookie. A refusal clears the cookie.
      responses:
        "200":
          description: New access token and a new refresh cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserRefreshResponse"
        "401":
          description: invalid_refresh; the cookie is cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/signout:
    post:
      tags: [browser]
      operationId: browserSignOut
      summary: End the current session or all sessions
      description: |
        scope `current` (default) ends the session of the access token and its refresh tokens
        and keeps the device recognized; `forget_client` also ends the recognition of this
        device. scope `all` ends every session and forgets every device of the user.
        Repeating a sign-out succeeds. The response also clears the refresh cookie (and the binding cookie with forget_client or scope all).
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignOutRequest"
      responses:
        "204":
          description: Signed out.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/me:
    delete:
      tags: [browser]
      operationId: browserDeleteAccount
      summary: Permanently delete the signed-in account
      description: |
        Requires a single-use step-up proof for delete_account. Removes access data,
        flows for the current email or owned by the account, and their mail jobs.
        Audit events remain for 90 days from their occurrence with cleared references.
        Mail already prepared for SMTP may still arrive. Offline access lasts until exp.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Step-Up
          in: header
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Account deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: step_up_required or permission_denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
    get:
      tags: [browser]
      operationId: browserGetMe
      summary: The signed-in user and the current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user and the session of the access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/sessions:
    get:
      tags: [browser]
      operationId: browserListSessions
      summary: The user's active sessions
      description: |
        Only the caller's own sessions, most recently active first, at most 100. No token,
        hash or binding is ever shown.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/sessions/{id}:
    delete:
      tags: [browser]
      operationId: browserRevokeSession
      summary: End one of the user's sessions
      description: |
        Ends the session and its refresh tokens; the device stays recognized. A session of
        another user and a session that does not exist give the same 204, so ids cannot be probed.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The session is ended, or there was none of the caller's to end.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/me/apps:
    get:
      tags: [browser]
      operationId: browserListApps
      summary: The applications the user has connected
      description: |
        The live grants the user holds with applications that sign users in through this provider,
        applications by name and the most recently used first, at most 200. A grant is what one
        application may do for the user on one sign-in; the same application appears once for each
        sign-in it holds a grant on. No token, secret or hash is ever shown. Only the caller's own.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAppList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/me/apps/grants/{id}:
    delete:
      tags: [browser]
      operationId: browserRevokeAppGrant
      summary: Take one grant of an application back
      description: |
        Ends the grant and its refresh tokens and tells the application's backend that this sign-in
        ended, so it closes its own session. It does not end the user's sign-in with the provider,
        any other grant or application, or anyone else's grants. It is not a ban: while the sign-in
        lives, the application may be opened again and be given a new grant. A grant of another
        user, one that is over and one that does not exist give the same 204, so ids cannot be
        probed. Ending access needs no step-up.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The grant is ended, or there was none of the caller's to end.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/me/apps/clients/{client_id}:
    delete:
      tags: [browser]
      operationId: browserRevokeApp
      summary: Take every grant of one application back
      description: |
        Ends every live grant the user holds with the application, on whichever sign-in, with the
        same effect and the same limits as ending one grant. An application the user holds nothing
        with, and one that does not exist, give the same 204.
