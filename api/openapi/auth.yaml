        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeStartRequest"
      responses:
        "202":
          description: The code is on its way to the new address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChangeStartResponse"
        "400":
          description: invalid_request, including an address the account already has.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: step_up_required, so run a step-up for change_email first.
