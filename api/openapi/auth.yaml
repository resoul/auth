          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/me/apps/grants/{id}:
    delete:
      tags: [native]
      operationId: nativeRevokeAppGrant
      summary: Take one grant of an application back
      description: |
        Ends the grant and its refresh tokens and tells the application's backend that this sign-in
        ended, so it closes its own session. It does not end the user's sign-in with the provider,
        any other grant or application, or anyone else's grants. It is not a ban: while the sign-in
        lives, the application may be opened again and be given a new grant. A grant of another
        user, one that is over and one that does not exist give the same 204, so ids cannot be
        probed. Ending access needs no step-up.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The grant is ended, or there was none of the caller's to end.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/native/me/apps/clients/{client_id}:
    delete:
      tags: [native]
      operationId: nativeRevokeApp
      summary: Take every grant of one application back
      description: |
