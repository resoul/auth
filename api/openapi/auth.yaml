          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRenameRequest"
      responses:
        "200":
          description: The passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: not_found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: permission_denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
    delete:
      tags: [browser]
      operationId: browserDeletePasskey
      summary: Delete a passkey
      description: |
        Needs the step-up token for delete_passkey. The last passkey cannot be deleted (last_passkey): a session needs
        one, so add the new key first. A refusal spends nothing. Another user's passkey and a missing one both give not_found.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Step-Up
          in: header
          required: false
          schema:
            type: string
          description: The step-up token of the operation; without a valid one the answer is step_up_required.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: permission_denied (a foreign origin) or step_up_required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: not_found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: last_passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/me/recovery-codes:
    post:
      tags: [browser]
      operationId: browserRegenerateRecoveryCodes
      summary: Replace the recovery codes
      description: |
        Needs the step-up token for regenerate_recovery_codes. The new set is shown once and the old one stops working at once.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Step-Up
          in: header
          required: false
          schema:
            type: string
          description: The step-up token of the operation; without a valid one the answer is step_up_required.
      responses:
        "200":
          description: The new codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: permission_denied (a foreign origin) or step_up_required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/me/email/change:
    post:
      tags: [browser]
      operationId: browserStartEmailChange
      summary: Ask for a code at a new email address
      description: |
        Needs the step-up token for change_email, which this request uses up. The code goes to the
        new address, whether or not an account has it, so the answer says nothing about who is
        registered; the old address changes only when `confirm` proves the code. The flow belongs to
        the signed-in session and to nobody else.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Step-Up
          in: header
          required: false
          schema:
            type: string
          description: The step-up token of the operation; without a valid one the answer is step_up_required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeStartRequest"
      responses:
        "202":
          description: The code is on its way to the new address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChangeStartResponse"
        "400":
          description: invalid_request, including an address the account already has.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: permission_denied (a foreign origin) or step_up_required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/me/email/change/confirm:
    post:
      tags: [browser]
      operationId: browserConfirmEmailChange
      summary: Prove the code from the new address and move the account
      description: |
        A wrong, expired or used code, another account's flow and a flow of another session all give
        the same invalid_code. The account keeps its sessions and passkeys; the recognition of its
        clients ends, and the old address is told. If another account took the address in the
        meantime the answer is email_taken and nothing changes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeConfirmRequest"
      responses:
        "200":
          description: The account has the new address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChangeResponse"
        "400":
          description: invalid_code or invalid_request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: email_taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /.well-known/jwks.json:
    get:
      tags: [public]
      operationId: getJWKS
      summary: Public keys that verify access tokens
      description: Public keys only; cacheable for a few minutes.
      responses:
        "200":
